[package]
name    = "api-syntaxes"
version.workspace = true
edition = "2021"

[dependencies]
api-shared   = { path = "../api-shared" }
parser       = { path = "../parser" }
service      = { path = "../service" }
lambda_http          = "1.2"
serde_json           = "1"
tokio                = { version = "1", features = ["full"] }
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }
