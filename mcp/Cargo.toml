[package]
name    = "mcp"
version = "0.1.0"
edition = "2021"

[profile.release]
debug = false
strip = true
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"

[features]
default = []
cli     = ["rmcp/transport-io", "tokio/io-std", "tokio/rt-multi-thread"]
http    = ["rmcp/transport-streamable-http-server", "tokio/full", "dep:axum"]

[dependencies]
service    = { path = "../service" }
rmcp       = { version = "1.5" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["rt", "macros"] }
anyhow     = "1"
axum       = { version = "0.8", optional = true }
