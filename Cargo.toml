[workspace]
members = [
    "parser",
    "converter",
    "service",
    "api-shared",
    "api-syntaxes",
    "api-convert",
    "mcp",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
rust-version = "1.80"

[profile.release]
debug = false
strip = true
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"