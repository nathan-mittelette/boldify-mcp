name: Build project

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.mcp-feature }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mcp-feature:
          - cli
          - http

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.mcp-feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.mcp-feature }}-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --features mcp/${{ matrix.mcp-feature }} -- -D warnings

      - name: Run tests
        run: cargo test --workspace --features mcp/${{ matrix.mcp-feature }}

      - name: Build workspace
        run: cargo build --workspace --features mcp/${{ matrix.mcp-feature }}
