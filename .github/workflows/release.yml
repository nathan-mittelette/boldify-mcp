name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            tool: cross
            artifact: boldify-mcp-linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            tool: cross
            artifact: boldify-mcp-linux-arm64
          # macOS (both targets built from macos-14 / Apple Silicon)
          - target: x86_64-apple-darwin
            runner: macos-14
            tool: cargo
            artifact: boldify-mcp-macos-amd64
          - target: aarch64-apple-darwin
            runner: macos-14
            tool: cargo
            artifact: boldify-mcp-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: sed -i.bak "s/^version *= *.*/version      = \"${GITHUB_REF_NAME#v}\"/" Cargo.toml && rm -f Cargo.toml.bak

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-
            ${{ runner.os }}-cargo-release-

      - name: Install cross
        if: matrix.tool == 'cross'
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.tool == 'cross'
        run: cross build --release --target ${{ matrix.target }} -p mcp --features mcp/cli

      - name: Build (cargo)
        if: matrix.tool == 'cargo'
        run: cargo build --release --target ${{ matrix.target }} -p mcp --features mcp/cli

      - name: Rename binary
        run: mv target/${{ matrix.target }}/release/mcp ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  deploy:
    name: Deploy to AWS Lambda
    environment:
      name: aws
      url: "https://api.boldify.net"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: sed -i.bak "s/^version *= *.*/version      = \"${GITHUB_REF_NAME#v}\"/" Cargo.toml && rm -f Cargo.toml.bak

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-lambda-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-lambda-

      - name: Build Lambda binaries
        run: cargo build --workspace --features mcp/http --release --target x86_64-unknown-linux-gnu

      - name: Prepare build directory with bootstrap binaries
        run: |
          mkdir -p build/api-convert build/api-syntaxes build/mcp-http
          cp target/x86_64-unknown-linux-gnu/release/api-convert build/api-convert/bootstrap
          cp target/x86_64-unknown-linux-gnu/release/api-syntaxes build/api-syntaxes/bootstrap
          cp target/x86_64-unknown-linux-gnu/release/mcp build/mcp-http/bootstrap

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy infrastructure
        working-directory: devops/terraform
        run: |
          tofu init
          tofu apply --var-file .tfvars -auto-approve

  release:
    name: Create GitHub Release
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: boldify-mcp-*
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: boldify-mcp-*
          generate_release_notes: true
