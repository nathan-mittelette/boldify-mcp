name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            tool: cross
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            tool: cross
          # macOS (both targets built from macos-14 / Apple Silicon)
          - target: x86_64-apple-darwin
            runner: macos-14
            tool: cargo
          - target: aarch64-apple-darwin
            runner: macos-14
            tool: cargo

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-
            ${{ runner.os }}-cargo-release-

      - name: Install cross
        if: matrix.tool == 'cross'
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.tool == 'cross'
        run: cross build --release --target ${{ matrix.target }} -p mcp --features mcp/cli

      - name: Build (cargo)
        if: matrix.tool == 'cargo'
        run: cargo build --release --target ${{ matrix.target }} -p mcp --features mcp/cli

      - name: Rename binary
        run: |
          mv target/${{ matrix.target }}/release/mcp mcp-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: mcp-${{ matrix.target }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: mcp-*
          generate_release_notes: true
